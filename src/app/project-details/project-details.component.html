<!-- Displays title and tags for a project -->
<div class="font-bold text-slate-400 text-4xl pt-5 ml-4 md:ml-0">{{data?.project_repo?.name}}</div>
<div class="flex items-center flex-wrap ml-10">
    <div class="" *ngFor="let tag of data?.project_repo?.topics">
        <div class="my-2 mx-0.5 px-5 h-7 w-fit size-3 rounded-lg text-white bg-slate-700">{{tag}}</div>
    </div>
</div>

<div class="bg-slate-700 text-slate-300 mx-10 my-2 py-2 px-5 rounded-md items-center">

    <!-- Displays all images for a project -->
    @if(data?.images.length > 0) {
        <div class="flex flex-col items-center">
            <div class="flex space-x-4 mt-2">
                <div *ngFor="let image of data?.images">
                    <a href={{image.download_url}} target="_blank"> <img class="md:max-w-80 h-auto" src={{image.download_url}} /> </a>
                </div>
            </div>

            <p class="mt-2 mb-6 text-xs">
                (Click an image to view the full size)
            </p>
        </div>
    }

    <!-- Displays Description -->
    <p class="mt-3 whitespace-break-spaces" [innerHTML]="data?.project_description"></p>

    <button class="mt-2 py-1 px-3 bg-slate-800 rounded-md hover:bg-slate-950" type="button">
        <a href={{data?.project_repo?.html_url}} target="_blank">GitHub Link</a>
    </button>
</div>
