<div class="pl-3 pt-1 pb-2">
    <div class="custom-line-height">

        <div class="font-bold">{{school.courseName}}</div>
        <span class="italic">{{school.schoolName}} / {{school.date}}</span>

        <ul *ngFor="let item of school.notes">
            <li class="list-disc ml-6">{{item}}</li>
        </ul>

        <span class="font-bold">Courses Taken: </span>
        {{school.coursesTaken}}

    </div>
</div>
