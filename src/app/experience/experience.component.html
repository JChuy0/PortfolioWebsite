<div class="pl-3 pt-1 pb-1">
  <div class="custom-line-height">

    <div class="font-bold">{{job.jobTitle}}</div>
    <span class="italic">{{job.companyName}} / {{job.date}}</span>

    @for (item of job.accomplishments; track item) {
      <ul class="list-disc ml-6 my-1">
        <li>{{item}}</li>
      </ul>
    }
  </div>

</div>
